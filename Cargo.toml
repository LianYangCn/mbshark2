[package]
name = "mbshark2"
version = "0.1.0"
edition = "2021"
description = "A cross-platform Modbus RTU serial capture tool with a GUI"
license = "MIT"

[workspace]
resolver = "2"

[features]
default = ["gui"]
# GUI feature pulls in eframe/egui/rfd/tokio-serial/serialport, which need
# system libs on Linux (xcb, xkbcommon, openssl, libudev, gtk3, pkg-config).
# Disable with --no-default-features to build/test the pure logic layer only.
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:tokio-serial", "dep:serialport"]

[lib]
name = "mbshark2"
path = "src/lib.rs"

[[bin]]
name = "mbshark2"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
eframe     = { version = "0.34", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui       = { version = "0.34", optional = true }
rfd        = { version = "0.15", optional = true }
tokio-serial = { version = "5.4", optional = true }
serialport   = { version = "4.9", optional = true }

tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "macros", "test-util"] }

[profile.release]
lto = true
strip = true